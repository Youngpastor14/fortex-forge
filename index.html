<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary SEO Meta ──────────────────────────────────────────────── -->
    <title>Fortex Forge — Brand Strategy, Identity &amp; Web for Ambitious Founders</title>
    <meta name="description" content="Fortex Forge is a strategic design consultancy helping ambitious founders build brands that earn trust, command authority, and generate growth. Strategy, identity, and web — end to end." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fortexforge.com/" />

    <!-- ─── Open Graph ────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://fortexforge.com/" />
    <meta property="og:title"       content="Fortex Forge — Brand Strategy, Identity &amp; Web" />
    <meta property="og:description" content="Strategic design consultancy helping ambitious founders build brands that earn trust, command authority, and generate growth." />
    <meta property="og:image"       content="https://fortexforge.com/assets/brand/og-image.webp" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ─── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Fortex Forge — Brand Strategy, Identity &amp; Web" />
    <meta name="twitter:description" content="Strategic design consultancy helping ambitious founders build brands that earn trust, command authority, and generate growth." />
    <meta name="twitter:image"       content="https://fortexforge.com/assets/brand/og-image.webp" />

    <!-- ─── Favicon Placeholder ───────────────────────────────────────────
         TODO: Replace with actual favicons once produced by design.
         ─────────────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/assets/brand/black_icon.svg" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />

    <!-- ─── Font Loading (Google Fonts) ───────────────────────────────────
         Instrument Sans: approved display/heading font
         Inter: approved body font
         Both loaded with font-display: swap via &display=swap parameter.
         Preconnect reduces DNS + TLS latency.
         ─────────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- ─── Material Symbols Outlined ────────────────────────────────────
         Variable font, subset to only weights used in designs.
         The Contact and Services pages reference these icons.
         ─────────────────────────────────────────────────────────────────── -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />

    <!-- ─── Schema.org Structured Data ───────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fortex Forge Ltd",
      "url": "https://fortexforge.com",
      "logo": "https://fortexforge.com/assets/brand/ff_prim_logo.svg",
      "description": "Strategic design consultancy helping ambitious founders build brands that earn trust, command authority, and generate growth.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "fortexforge@gmail.com",
        "contactType": "customer service"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
